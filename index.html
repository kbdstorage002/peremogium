<style>
  :root {
    color-scheme: dark;
    --bg: #080a0f;
    --panel: #0e121a;
    --panel-2: #131824;
    --border: #1d2433;
    --border-2: #273044;
    --text: #e8ecf3;
    --text-2: #a9b2c3;
    --muted: #6b7588;
    --accent: #5ab0ff;
    --prev: #3987e5; --cur: #c98500;
    --good: #2fbf71;
    --good-bg: rgba(47,191,113,.12);
    --bad: #f0616d;
    --warn: #e6a23c;
    --fire: #ff7a3d;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(57,135,229,.10), transparent 60%),
      radial-gradient(900px 400px at 100% 0%, rgba(201,133,0,.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
  a { color: inherit; text-decoration: none; }

  header { padding: 36px 0 0; }
  .logo { display: inline-flex; color: var(--text); }
  .logo svg { height: 26px; width: auto; display: block; }
  .logo:hover { color: #fff; }
  nav.tabs a { font: 500 13px Inter, sans-serif; color: var(--text-2); padding: 7px 13px; border-radius: 7px; }
  nav.tabs a.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }
  nav.tabs a:hover { color: var(--text); }

  .panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 22px; }
  .tag { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .go { font: 500 12px Inter, sans-serif; color: #8cbcf3; white-space: nowrap; }
  a:hover .go { color: #b7d8fb; }
  .badge { font: 600 12px var(--mono); padding: 3px 8px; border-radius: 7px; white-space: nowrap; color: var(--good); background: var(--good-bg); box-shadow: inset 0 0 0 1px rgba(47,191,113,.3); }
  .badge.warn { color: var(--warn); background: rgba(230,162,60,.12); box-shadow: inset 0 0 0 1px rgba(230,162,60,.35); }
  .badge.bad { color: var(--bad); background: rgba(240,97,109,.12); box-shadow: inset 0 0 0 1px rgba(240,97,109,.3); }
  .num { font: 600 34px var(--mono); letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .num small { font: 400 13px Inter, sans-serif; color: var(--text-2); margin-left: 6px; letter-spacing: 0; }
  .line { font-size: 14px; color: var(--text-2); line-height: 1.5; margin: 0; }
  .line b { color: var(--text); font-weight: 600; }

  /* ---------- Головний графік ---------- */
  .hero { margin: 26px 0 14px; padding: 24px 26px 18px; }
  .hero-top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .hero h1 { font-size: clamp(22px, 2.8vw, 30px); line-height: 1.2; margin: 6px 0 0; font-weight: 700; letter-spacing: -.015em; max-width: 720px; }
  .hero h1 em { font-style: normal; color: color-mix(in srgb, var(--cur) 80%, #fff); }
  .hero .num { text-align: right; font-size: 44px; color: color-mix(in srgb, var(--cur) 80%, #fff); }
  .hero .num small { display: block; margin: 4px 0 0; text-align: right; }
  /* Стовпчики темпу: нуль може бути не внизу (рік, коли звільнили більше, ніж втратили) */
  .pchart { position: relative; height: 210px; margin: 34px 0 30px; display: flex; gap: clamp(12px, 3vw, 40px); padding: 0 clamp(0px, 4vw, 60px); }
  .pzero { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border-2); }
  .pcol { position: relative; flex: 1; }
  .pbar { position: absolute; left: 14%; right: 14%; border-radius: 6px 6px 2px 2px; opacity: .55;
    transform: scaleY(0); transform-origin: 50% 100%; transition: transform .8s cubic-bezier(.3,1.2,.5,1); transition-delay: calc(var(--i) * 110ms); }
  .pbar.neg { border-radius: 2px 2px 6px 6px; transform-origin: 50% 0; }
  .pcol.cur .pbar { opacity: 1; box-shadow: 0 0 24px color-mix(in srgb, var(--cur) 40%, transparent); }
  .in .pbar { transform: scaleY(1); }
  .pval { position: absolute; left: 0; right: 0; text-align: center; font: 600 15px var(--mono); color: var(--text-2); }
  .pval small { display: block; font: 400 11px Inter, sans-serif; color: var(--good); }
  .pcol.cur .pval { color: #fff; font-size: 18px; }
  .pyr { position: absolute; left: 0; right: 0; bottom: -24px; text-align: center; font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .pcol.cur .pyr { color: var(--text-2); }
  .held { display: flex; align-items: center; gap: 16px; padding-top: 16px; border-top: 1px dashed var(--border-2); }
  .held-bar { flex: 0 0 180px; height: 8px; border-radius: 4px; background: #39404d; overflow: hidden; }
  .held-bar i { display: block; height: 100%; background: linear-gradient(90deg, #3b82d6, #e3b341); }
  .held p { margin: 0; font-size: 13px; color: var(--text-2); }
  .held b { color: var(--text); }

  /* ---------- Чотири картки-розділи ---------- */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  a.card { display: flex; flex-direction: column; gap: 10px; transition: border-color .2s, transform .2s; }
  a.card:hover { border-color: #34405a; transform: translateY(-2px); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card-num { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card .num { color: color-mix(in srgb, var(--cur) 78%, #fff); }
  .viz { position: relative; height: 140px; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .axis { font: 10px var(--mono); fill: var(--muted); }
  .vlbl { font: 600 11px var(--mono); fill: var(--text-2); }
  .key { display: flex; gap: 14px; flex-wrap: wrap; font: 11px var(--mono); color: var(--muted); }
  .key i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 2px; }

  /* ---------- Цифра дня і «Чесно» ---------- */
  .strip { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
  .fact { display: flex; gap: 18px; align-items: center; border-color: rgba(201,133,0,.3); background: linear-gradient(120deg, rgba(201,133,0,.10), var(--panel) 60%); }
  .fact .num { color: color-mix(in srgb, var(--cur) 80%, #fff); white-space: nowrap; }
  .fact .line { flex: 1; color: var(--text); }
  .btn { font: 500 12px Inter, sans-serif; color: var(--text-2); background: var(--panel); border: 1px solid var(--border-2); border-radius: 9px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { color: var(--text); }
  .btn.ok { color: var(--good); border-color: rgba(47,191,113,.4); }
  .honest { border-color: rgba(230,162,60,.28); display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .honest .tag { color: var(--warn); }

  footer { padding: 26px 0 44px; color: var(--muted); font: 12px var(--mono); margin-top: 30px; border-top: 1px solid var(--border); }
  .err { margin: 40px 0; padding: 20px; border: 1px solid var(--bad); border-radius: var(--r); color: var(--bad); }

  /* ---------- Анімації: стартують, коли блок потрапляє в поле зору (.in) ---------- */
  .wipe { transform: scaleX(0); transform-origin: 0 0; transition: transform 1.8s cubic-bezier(.45,.05,.25,1); }
  .in .wipe { transform: scaleX(1); }
  .in .wipe.d2 { transition-delay: .35s; }
  .bar { transform: scaleY(0); transform-box: fill-box; transform-origin: 50% 100%; transition: transform .7s cubic-bezier(.3,1.3,.5,1); transition-delay: calc(var(--i) * 60ms); }
  .in .bar { transform: scaleY(1); }
  .fadein { opacity: 0; transition: opacity .5s; transition-delay: calc(.8s + var(--i, 0) * 60ms); }
  .in .fadein { opacity: 1; }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; height: 100%; }
  .heat i { border-radius: 3px; background: var(--c); opacity: 0; transform: scale(.4); transition: opacity .4s, transform .4s; transition-delay: calc(var(--i) * 12ms); }
  .heat i.empty { background: rgba(255,255,255,.03); }
  .in .heat i { opacity: var(--o, 1); transform: scale(1); }
  .heat i.max { box-shadow: 0 0 0 1.5px #fff; }
  .pulse { transform-box: fill-box; transform-origin: center; }
  .in .pulse { animation: pulse 2.4s ease-out 1.6s infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 70%, 100% { transform: scale(3.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .wipe, .bar, .fadein, .heat i { transition: none !important; }
    .in .pulse { animation: none; }
  }

  @media (max-width: 860px) {
    .cards, .strip { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .hero { padding: 18px 16px 14px; }
    .hero .num, .hero .num small { text-align: left; }
    .pchart { height: 170px; }
    .pval { font-size: 13px; } .pcol.cur .pval { font-size: 15px; }
    .held { flex-direction: column; align-items: stretch; gap: 10px; }
    .held-bar { flex: none; }
    .fact { flex-wrap: wrap; }
    .num { font-size: 28px; }
  }
</style>

<script>
(() => {
const D = window.PEREMOGIUM_DATA, NPZ = window.NPZ_DATA, YRS = window.PEREMOGIUM_YEARS;
if (!D) {
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin', '<div class="err">Не вдалося завантажити дані (data/data.js). Запустіть <code>npm run update</code>.</div>');
  return;
}

// ================= ДОВІДНИКИ =================
const MS = ['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
const MGEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const sp = n => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
const dec = (n, d = 1) => n.toFixed(d).replace('.', ',');
const sum = a => a.reduce((s, x) => s + (x ?? 0), 0);
const pct = (a, b) => (b / a - 1) * 100;
const plural = (n, [one, few, many]) => { n = Math.abs(Math.round(n)) % 100; const d = n % 10; return n > 10 && n < 20 ? many : d === 1 ? one : d >= 2 && d <= 4 ? few : many; };
const times = r => r >= 10 ? `у ${Math.round(r)} ${plural(r, ['раз', 'рази', 'разів'])}` : `у ${dec(r)} раза`;
const dm = iso => { const d = new Date(iso + 'T00:00:00Z'); return `${d.getUTCDate()} ${MGEN[d.getUTCMonth()]}`; };
const dateUA = iso => { const d = new Date(iso); return `${d.getUTCDate()} ${MGEN[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const dim = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
const iso = t => new Date(t).toISOString().slice(0, 10);
const COL = YRS?.color || (y => ({ 2025: '#3987e5', 2026: '#c98500' })[y]);

// ================= РОКИ =================
const hasData = y => (D.personnel.monthly[y]?.length || D.personnel.partial?.[y]) && (D.territory.monthly[y]?.length || D.territory.partial?.[y]);
const PAIRS = (YRS?.pairs || [2026]).filter(y => D.personnel.monthly[y - 1]);
const CUR = PAIRS.find(hasData) ?? PAIRS.at(-1), PREV = CUR - 1;
const C_CUR = COL(CUR), C_PREV = COL(PREV);
document.documentElement.style.setProperty('--cur', C_CUR);
document.documentElement.style.setProperty('--prev', C_PREV);
const YEAR_HREF = CUR === PAIRS[0] ? 'year.html' : 'year.html?y=' + CUR;

// ================= ЩОДЕННІ ВТРАТИ =================
const t0 = Date.parse(D.personnel.daily.start + 'T00:00:00Z');
const daily = D.personnel.daily.values.map((v, i) => ({ d: iso(t0 + i * 864e5), v }));
const dayVal = new Map(daily.map(x => [x.d, x.v]));
const last = daily.at(-1);

// ================= З ПОЧАТКУ РОКУ (так само, як на сторінці року) =================
const NF = Math.min(D.territory.monthly[CUR].length, D.personnel.monthly[CUR].length);
const tp = D.territory.partial?.[CUR];
const ppDays = []; for (let d = 1; d <= 31; d++) { const v = dayVal.get(`${CUR}-${String(NF + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`); if (v == null) break; ppDays.push(v); }
const HAS_P = !!(tp && tp.month === NF + 1 && ppDays.length);
const N25 = Math.min(D.territory.monthly[PREV].length, D.personnel.monthly[PREV].length);
const DAYS = y => Array.from({ length: 12 }, (_, m) => dim(y, m));
const terr = { [PREV]: D.territory.monthly[PREV].slice(0, N25), [CUR]: [...D.territory.monthly[CUR].slice(0, NF), ...(HAS_P ? [tp.value] : [])] };
const terrD = { [PREV]: DAYS(PREV).slice(0, N25), [CUR]: [...DAYS(CUR).slice(0, NF), ...(HAS_P ? [new Date(tp.asOf).getUTCDate()] : [])] };
const pers = { [PREV]: D.personnel.monthly[PREV].slice(0, N25), [CUR]: [...D.personnel.monthly[CUR].slice(0, NF), ...(HAS_P ? [sum(ppDays)] : [])] };
const persD = { [PREV]: DAYS(PREV).slice(0, N25), [CUR]: [...DAYS(CUR).slice(0, NF), ...(HAS_P ? [ppDays.length] : [])] };
const t26 = sum(terr[CUR]), p25 = sum(pers[PREV]), p26 = sum(pers[CUR]);
const r25 = sum(terr[PREV]) / sum(terrD[PREV]), r26 = t26 / sum(terrD[CUR]);
const pr25 = p25 / sum(persD[PREV]), pr26 = p26 / sum(persD[CUR]);
const slower = r26 < r25;

// Ціна 1 км² — як на сторінці всієї війни: втрати рф ÷ усе захоплене (звільнене не віднімаємо)
const warYears = (D.years || []).filter(y => y <= CUR).map(yr => {
  const pm = [...D.personnel.monthly[yr]], gm = [...(D.territory.gained?.[yr] || [])];
  if (yr === CUR) { pm.length = gm.length = NF; if (HAS_P) { pm.push(sum(ppDays)); gm.push(D.territory.partialGained?.[CUR]?.value ?? null); } }
  const g = sum(gm), p = sum(pm.map((v, m) => gm[m] == null ? 0 : v));
  return { yr, price: g > 0 ? p / g : null };
}).filter(r => r.price);
const price25 = warYears.find(r => r.yr === PREV)?.price, price26 = warYears.find(r => r.yr === CUR)?.price;
const priceUp = price26 >= price25;
const rank = [...warYears].sort((a, b) => b.price - a.price).findIndex(r => r.yr === CUR) + 1;

// ================= НПЗ =================
const npzAsOf = NPZ?.asOf || last.d;
const strikes = NPZ?.strikes || [];
const s26 = strikes.filter(s => s.date.startsWith(CUR + '-') && s.date <= npzAsOf);
const s25 = strikes.filter(s => s.date.startsWith(PREV + '-') && s.date <= npzAsOf.replace(/^\d{4}/, PREV));
const plants26 = new Set(s26.map(s => s.id)).size;

// ================= SVG-ПОМІЧНИКИ =================
const W = 300, H = 140;
const bars = (vals, { colors, labels, top = [], pad = 4, hl = -1, dashedLast = false }) => {
  const mx = Math.max(...vals, 1), bw = (W - 2 * pad) / vals.length;
  return vals.map((v, i) => {
    const h = Math.max(v / mx * (H - 36), 1), bx = pad + i * bw + bw * .16, by = H - 18 - h, cx = (bx + bw * .34).toFixed(1);
    const dash = dashedLast && i === vals.length - 1;
    return `<rect class="bar" style="--i:${i}" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(bw * .68).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${colors(i)}" fill-opacity="${dash ? .45 : i === hl || hl < 0 ? 1 : .5}"${dash ? ` stroke="${colors(i)}" stroke-dasharray="3 2"` : ''}/>`
      + (top[i] != null ? `<text class="vlbl fadein" style="--i:${i}" x="${cx}" y="${(by - 5).toFixed(1)}" text-anchor="middle"${i === hl ? ' fill="#fff"' : ''}>${top[i]}</text>` : '')
      + (labels[i] ? `<text class="axis" x="${cx}" y="${H - 4}" text-anchor="middle">${labels[i]}</text>` : '');
  }).join('');
};

// ================= 1. ГОЛОВНИЙ ГРАФІК: темп наступу рф по роках =================
// км² на добу (захоплене мінус звільнене, як на сторінці року). 2022-й не беремо: фронт тоді рухався в обидва боки,
// і даних DeepState до травня немає.
const UA = 603628;                                                  // площа України, км²
const paceYears = (D.years || []).filter(y => y >= 2023 && y <= CUR).map(yr => {
  if (yr === CUR) return { yr, v: r26 };
  const m = D.territory.monthly[yr], n = m.filter(v => v != null).length;
  return { yr, v: sum(m) / sum(DAYS(yr).slice(0, n)) };
});
const lowerBefore = paceYears.filter(p => p.yr < CUR && p.v <= r26).at(-1);   // останній рік, коли було ще повільніше
const pMax = Math.max(...paceYears.map(p => p.v), 0), pMin = Math.min(...paceYears.map(p => p.v), 0);
const zeroTop = pMax / (pMax - pMin || 1) * 100;                  // де нуль, % від висоти графіка
const heroBars = paceYears.map((p, i) => {
  const cur = p.yr === CUR, neg = p.v < 0, h = Math.abs(p.v) / (pMax - pMin || 1) * 100;
  const col = neg ? 'var(--good)' : COL(p.yr);
  return `<div class="pcol${cur ? ' cur' : ''}">
    <div class="pbar${neg ? ' neg' : ''}" style="--i:${i};top:${neg ? zeroTop : zeroTop - h}%;height:${Math.max(h, .6)}%;background:${col}"></div>
    <div class="pval fadein" style="--i:${i};bottom:calc(${100 - zeroTop + (neg ? 0 : h)}% + 6px)">${neg ? '−' : ''}${dec(Math.abs(p.v))}${neg ? '<small>звільнено більше</small>' : ''}</div>
    <div class="pyr">${p.yr}${cur ? ' · зараз' : ''}</div>
  </div>`;
}).join('');
const occPct = D.territory.occupiedNow / UA * 100;
const B = D.territory.boundaries || {}, yAgoKey = `${CUR - 1}-${String(new Date(D.territory.asOf).getUTCMonth() + 1).padStart(2, '0')}`;
const yAgo = B[yAgoKey]?.area;
document.getElementById('hero').innerHTML = `
  <div class="hero-top">
    <div><div class="tag">Темп наступу рф по роках · DeepState</div>
      <h1>${slower ? `У ${CUR}-му росія просувається <em>${lowerBefore ? `найповільніше з ${lowerBefore.yr}-го` : 'найповільніше за всі роки'}</em>.` : `Темп наступу рф по роках.`}</h1></div>
    <div class="num"><span class="count" data-to="${r26}" data-d="1">${dec(r26)}</span><small>км² на добу · у ${PREV}-му — ${dec(r25)}</small></div>
  </div>
  <div class="pchart"><div class="pzero" style="top:${zeroTop}%"></div>${heroBars}</div>
  <div class="held">
    <div class="held-bar"><i style="width:${(100 - occPct).toFixed(2)}%"></i></div>
    <p><b>${dec(100 - occPct)}%</b> території України — під контролем України. Окуповано ${dec(occPct)}% (${sp(D.territory.occupiedNow)} км²)${yAgo ? `; за рік ця частка зросла на ${dec((D.territory.occupiedNow - yAgo) / UA * 100, 2)} п.п.` : '.'}</p>
  </div>`;

// ================= 2. ЧОТИРИ КАРТКИ-РОЗДІЛИ =================
const card = ({ href, tag, num, unit, badge, good = true, tone, viz, key = '', line }) => `
  <a class="panel card" href="${href}">
    <div class="card-top"><span class="tag">${tag}</span><span class="go">Подивитись детальніше →</span></div>
    <div class="card-num"><div class="num"><span class="count" data-to="${num.n}" data-d="${num.d || 0}">${num.d ? dec(num.n, num.d) : sp(num.n)}</span><small>${unit}</small></div>${badge ? `<span class="badge ${tone || (good ? '' : 'bad')}">${badge}</span>` : ''}</div>
    <div class="viz">${viz}</div>
    ${key}
    <p class="line">${line}</p>
  </a>`;

// а) Ціна км² по роках
const vizPrice = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${bars(warYears.map(r => r.price), {
  colors: i => COL(warYears[i].yr), labels: warYears.map(r => r.yr), top: warYears.map(r => sp(r.price)), pad: 10,
  hl: warYears.findIndex(r => r.yr === CUR) })}</svg>`;

// б) Нафтогазові доходи рф: у середньому за місяць, по роках
const OY = D.oilGasYears?.years || {}, OG = D.oilGas;
const oilRows = Object.keys(OY).map(Number).filter(y => y < CUR).map(y => ({ yr: y, v: OY[y] / 12 }));
if (OG?.year === CUR) oilRows.push({ yr: CUR, v: OG.value / OG.months, part: true });
const HAS_OIL = oilRows.length > 1 && OG?.year === CUR;
const vizOil = HAS_OIL ? `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${bars(oilRows.map(r => r.v), {
  colors: i => COL(oilRows[i].yr), labels: oilRows.map(r => r.yr), top: oilRows.map(r => dec(r.v, 2)), pad: 10,
  hl: oilRows.length - 1 })}</svg>` : '';
const keyOil = `<div class="key"><span>трлн ₽ на місяць, у середньому за рік${HAS_OIL ? ` · ${CUR}: ${OG.period}` : ''}</span></div>`;

// в) Календар: остання доба проти попередньої
const prevDay = daily.at(-2)?.v, dayUp = last.v >= prevDay;
const dayPct = prevDay ? Math.round(Math.abs(pct(prevDay, last.v))) : 0;
const dayBadge = prevDay ? `на ${dayPct}% ${dayUp ? 'більше' : 'менше'}, ніж учора` : '';
// Календар: останні 10 тижнів по днях
const WEEKS = 10, lastT = Date.parse(last.d + 'T00:00:00Z');
const startT = lastT - (((new Date(lastT).getUTCDay() + 6) % 7) + (WEEKS - 1) * 7) * 864e5;
const cells = []; for (let t = startT, i = 0; i < WEEKS * 7; t += 864e5, i++) cells.push({ d: iso(t), v: t <= lastT ? dayVal.get(iso(t)) : null });
const vals = cells.map(c => c.v).filter(v => v != null), vmin = Math.min(...vals), vmax = Math.max(...vals);
const maxCell = cells.find(c => c.v === vmax);
const vizCal = `<div class="heat">${cells.map((c, i) => c.v == null ? `<i class="empty" style="--i:${i}"></i>`
  : `<i${c === maxCell ? ' class="max"' : ''} style="--i:${i};--c:${C_CUR};--o:${(.15 + .85 * (c.v - vmin) / (vmax - vmin || 1)).toFixed(2)}" title="${dm(c.d)}: ${sp(c.v)}"></i>`).join('')}</div>`;

// г) НПЗ: влучання по місяцях за 12 місяців
const months12 = []; { const d = new Date(npzAsOf + 'T00:00:00Z'); for (let k = 11; k >= 0; k--) months12.push(iso(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - k, 1)).slice(0, 7)); }
const byM = months12.map(m => strikes.filter(s => s.date.startsWith(m)).length), mxM = Math.max(...byM);
const vizNpz = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${bars(byM, {
  colors: () => 'var(--fire)', labels: months12.map((m, i) => i % 3 === 0 || i === 11 ? MS[+m.slice(5) - 1] : ''),
  top: byM.map(n => n === mxM ? n : null), dashedLast: true })}</svg>`;

document.getElementById('cards').innerHTML = [
  card({ href: 'war.html', tag: 'Ціна 1 км² для рф', num: { n: price26 }, unit: 'свинособак/км²',
    badge: priceUp ? `${dec(price26 / price25)}× дорожче` : `${dec(price25 / price26)}× дешевше`, good: priceUp, viz: vizPrice,
    line: (rank === 1 ? `${CUR}-й — <b>найдорожчий рік</b> війни для рф.` : `${CUR}-й — ${rank}-й за ціною рік війни.`) + ' Убиті й поранені разом.' }),
  HAS_OIL && card({ href: YEAR_HREF, tag: 'Нафтогазові доходи рф', num: { n: OG.value / OG.months, d: 2 }, unit: `трлн ₽ на місяць у ${CUR}`,
    badge: `${OG.changePct < 0 ? '−' : '+'}${Math.abs(OG.changePct)}% до торік`, good: OG.changePct < 0, viz: vizOil, key: keyOil,
    line: OG.planNew < OG.planOld ? `Мінфін рф урізав план на рік: ${dec(OG.planOld, 2)} → <b>${dec(OG.planNew, 2)}</b> трлн ₽.` : `За ${OG.period} ${CUR}-го — ${dec(OG.value, 2)} трлн ₽.` }),
  card({ href: 'calendar.html', tag: 'Втрати рф з 1 січня', num: { n: p26 }, unit: 'осіб',
    badge: dayBadge, tone: dayUp ? 'good' : 'warn', viz: vizCal,
    line: `За останню добу — <b>${sp(last.v)}</b>. Найкращий для нас день за 10 тижнів — ${dm(maxCell.d)}, ${sp(maxCell.v)}.` }),
  card({ href: 'npz.html', tag: 'Удари по НПЗ рф', num: { n: s26.length }, unit: `влучань у ${CUR}`,
    badge: s25.length && s26.length > s25.length ? `${dec(s26.length / s25.length)}× більше` : '', viz: vizNpz,
    line: `${plants26} ${plural(plants26, ['завод', 'заводи', 'заводів'])} уражено цього року.` }),
].filter(Boolean).join('');

// ================= 3. ЦИФРА ДНЯ =================
const libCur = sum([...(D.territory.liberated?.[CUR] || []).slice(0, NF), ...(HAS_P ? [D.territory.partialLiberated?.[CUR]?.value] : [])]);
const recCur = daily.filter(x => x.d.startsWith(CUR + '-')).reduce((a, b) => b.v > a.v ? b : a, { v: 0 });
const oil = D.oilGas;
const SITE = 'https://calmnessuniverse.art/peremogium/';
const facts = [
  priceUp && { big: sp(price26), text: `військових втрачає рф за кожен захоплений км² — ${times(price26 / price25)} більше, ніж торік.` },
  slower && { big: dec(r26) + ' км²', text: `на добу захоплює росія у ${CUR}-му. Торік — ${dec(r25)}.` },
  { big: sp(D.personnel.totalSinceInvasion), text: `військових рф убито й поранено від початку вторгнення.` },
  libCur > 1 && { big: sp(libCur) + ' км²', text: `звільнили сили оборони з початку ${CUR}-го.` },
  s26.length && { big: String(s26.length), text: `влучань по НПЗ рф у ${CUR}-му.` },
  oil?.year === CUR && oil.changePct < 0 && { big: `−${Math.abs(oil.changePct)}%`, text: `нафтогазові доходи рф за ${oil.period} проти торішніх.` },
  recCur.v && { big: sp(recCur.v), text: `втрат рф за одну добу — ${dm(recCur.d)}, найкращий для нас день ${CUR}-го.` },
].filter(Boolean);
const kyiv = new Date(Date.now() + 2 * 3600e3);
let fi = Math.floor((Date.UTC(kyiv.getUTCFullYear(), kyiv.getUTCMonth(), kyiv.getUTCDate()) - Date.UTC(kyiv.getUTCFullYear(), 0, 0)) / 864e5) % facts.length;
const renderFact = () => {
  const f = facts[fi];
  document.getElementById('fact').innerHTML = `<div class="num">${f.big}</div><p class="line">${f.text}</p>
    <div style="display:flex;gap:6px"><button class="btn" id="copyFact">Скопіювати</button><button class="btn" id="nextFact" aria-label="Інший факт">↻</button></div>`;
  document.getElementById('copyFact').onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(`${f.big} — ${f.text}\n${SITE}`); b.textContent = 'Скопійовано ✓'; b.classList.add('ok'); }
    catch { b.textContent = 'Не вдалося'; }
    setTimeout(() => { b.textContent = 'Скопіювати'; b.classList.remove('ok'); }, 1800);
  };
  document.getElementById('nextFact').onclick = () => { fi = (fi + 1) % facts.length; renderFact(); };
};
renderFact();

// ================= 4. ЧЕСНО =================
document.getElementById('honest').innerHTML = `<span class="tag">⚠ Чесно</span>
  <p class="line">Росія все одно просувається: <b>${sp(t26)} км²</b> з початку ${CUR}-го. Повільніше, але це більше за площу Києва.</p>`;

document.getElementById('footer').textContent =
  `Перемогіум · дані на ${dateUA(D.generatedAt)} · Генштаб ЗСУ, DeepState, Мінфін рф, Вікіпедія — подробиці в розділах`;

// ================= АНІМАЦІЯ ПРИ ПОЯВІ =================
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const countUp = el => {
  const to = +el.dataset.to, d = +el.dataset.d, t1 = performance.now();
  const step = now => { const k = Math.min(1, (now - t1) / 1100), v = to * (1 - (1 - k) ** 3); el.textContent = d ? dec(v, d) : sp(v); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in');
  if (!reduce) e.target.querySelectorAll('.count').forEach(countUp);
  io.unobserve(e.target);
}), { threshold: .3 });
document.querySelectorAll('.hero, .card').forEach(el => io.observe(el));
})();
</script>
<script src="assets/nav.js"></script>
</body>
</html>
