<script>
(() => {
const D = window.PEREMOGIUM_DATA;
if (!D || !D.personnel.daily) {
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin', '<div class="err">Не вдалося завантажити дані (data/data.js). Запустіть <code>npm run update</code>.</div>');
  return;
}

// ---------- Дані ----------
const MFA  = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MLOC = ['січні','лютому','березні','квітні','травні','червні','липні','серпні','вересні','жовтні','листопаді','грудні'];
const MGEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const WDF = ['понеділок','вівторок','середа','четвер','пʼятниця','субота','неділя'];

// Увесь щоденний ряд (з 2022) — для «Роки поруч»; «Місяць» і «Рік» — з 2025-го, як і раніше.
const t0 = Date.parse(D.personnel.daily.start + 'T00:00:00Z');
const allByDate = new Map(D.personnel.daily.values.map((v, i) => [new Date(t0 + i * 864e5).toISOString().slice(0, 10), v]));
const CAL_FROM = '2025-01-01';
const byDate = new Map([...allByDate].filter(([k]) => k >= CAL_FROM));
const VALS = [...byDate.values()];
const START = [...byDate.keys()][0];
const lastDate = new Date([...byDate.keys()].at(-1) + 'T00:00:00Z');
const LAST = { y: lastDate.getUTCFullYear(), m: lastDate.getUTCMonth() };
const FIRST = { y: +START.slice(0, 4), m: +START.slice(5, 7) - 1 };
const MAX = Math.max(...VALS);                      // спільний масштаб для всіх місяців і років
const recordDate = [...byDate].find(([, v]) => v === MAX)[0];
const YEARS = [...new Set([...byDate.keys()].map(k => +k.slice(0, 4)))];

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// Колір за величиною втрат: тьмяний червоний (мінімум за весь період) → яскравий червоний (рекорд).
const MIN = Math.min(...VALS);
const RAMP = ['#3a171c', '#8f2a33', '#ff5a62'].map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
function heat(v) {
  const t = Math.max(0, Math.min(1, (v - MIN) / (MAX - MIN))) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i;
  return 'rgb(' + RAMP[i].map((c, j) => Math.round(c + (RAMP[i + 1][j] - c) * f)).join(',') + ')';
}
const sp = n => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
const pad = n => String(n).padStart(2, '0');
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
const firstWd = (y, m) => (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7;
const plural = (n, [one, few, many]) => { n = Math.abs(Math.round(n)) % 100; const d = n % 10; return n > 10 && n < 20 ? many : d === 1 ? one : d >= 2 && d <= 4 ? few : many; };
const people = n => `${sp(n)} ${plural(n, ['особа', 'особи', 'осіб'])}`;

// Діаметр кола: площа пропорційна втратам; найбільший день = 125% клітинки.
const diam = v => 125 * Math.sqrt(v / MAX);

function monthDays(y, m) {
  const out = [];
  for (let d = 1; d <= daysIn(y, m); d++) out.push({ d, k: key(y, m, d), v: byDate.get(key(y, m, d)) });
  return out;
}
function monthStats(y, m, limitDays) {
  const days = monthDays(y, m).slice(0, limitDays ?? 31).filter(x => x.v != null);
  if (!days.length) return null;
  const tot = days.reduce((s, x) => s + x.v, 0);
  const mx = days.reduce((a, b) => (b.v > a.v ? b : a)), mn = days.reduce((a, b) => (b.v < a.v ? b : a));
  return { tot, n: days.length, avg: tot / days.length, mx, mn, complete: days.length === daysIn(y, m) };
}

// ---------- Стан (у адресі, щоб можна було поділитися посиланням) ----------
let state = { view: 'month', y: LAST.y, m: LAST.m, cm: LAST.m };
function readHash() {
  const h = location.hash.slice(1);
  let mm;
  if ((mm = h.match(/^roky-(\d{2})$/))) state = { ...state, view: 'years', cm: Math.min(11, Math.max(0, +mm[1] - 1)) };
  else if ((mm = h.match(/^(\d{4})-(\d{2})$/))) state = { view: 'month', y: +mm[1], m: +mm[2] - 1 };
  else if ((mm = h.match(/^(\d{4})$/))) state = { view: 'year', y: +mm[1], m: state.m };
  clamp();
}
function clamp() {
  const idx = state.y * 12 + state.m, lo = FIRST.y * 12 + FIRST.m, hi = LAST.y * 12 + LAST.m;
  const c = Math.min(hi, Math.max(lo, idx));
  state.y = Math.floor(c / 12); state.m = c % 12;
  if (state.view === 'year') state.y = Math.min(LAST.y, Math.max(FIRST.y, state.y));
}
function go(next) {
  state = { ...state, ...next }; clamp();
  const h = state.view === 'years' ? `roky-${pad(state.cm + 1)}` : state.view === 'year' ? `${state.y}` : `${state.y}-${pad(state.m + 1)}`;
  history.replaceState(null, '', '#' + h);
  render();
}

// ---------- Підказка ----------
const tip = document.getElementById('tip');
function showTip(el) {
  const k = el.dataset.k, v = byDate.get(k), dt = new Date(k + 'T00:00:00Z');
  const y = dt.getUTCFullYear(), m = dt.getUTCMonth(), d = dt.getUTCDate();
  const prev = byDate.get(key(y - 1, m, d));
  tip.innerHTML = `<b>${WDF[(dt.getUTCDay() + 6) % 7]}, ${d} ${MGEN[m]} ${y}</b><span class="v">${people(v)}</span>` +
    (k === recordDate ? '<br>рекорд за весь період' : monthStats(y, m).mx.k === k ? '<br>найкращий день місяця 🤯' : '') +
    (prev != null ? `<br>рік тому того ж дня: ${sp(prev)}` : '');
  const r = el.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2, yy = r.top - th - 8;
  if (yy < 8) yy = r.bottom + 8;
  tip.style.left = Math.max(8, Math.min(innerWidth - tw - 8, x)) + 'px';
  tip.style.top = yy + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };
addEventListener('scroll', hideTip, { passive: true });

// ---------- Рендер ----------
const view = document.getElementById('view');

function calGrid(y, m, { labels = true, animate = true, interactive = true, best = null } = {}) {
  const tag = interactive ? 'button' : 'span'; // кнопку не можна вкладати в кнопку-місяць
  let h = '<div class="cal">';
  for (let i = 0; i < firstWd(y, m); i++) h += '<div class="cell"></div>';
  for (const x of monthDays(y, m)) {
    if (x.v == null) { h += `<div class="cell future"><span class="n">${x.d}</span></div>`; continue; }
    const s = diam(x.v);
    h += `<div class="cell has"><${tag} class="dot${x.k === recordDate ? ' rec' : ''}" data-k="${x.k}"${interactive ? ` aria-label="${x.d} ${MGEN[m]}: ${people(x.v)}"` : ''}
      style="--c:${heat(x.v)};width:${s}%;height:${s}%;${animate ? '--s:0' : ''}"></${tag}><span class="n">${x.d}</span>${x.k === best
        ? `<span class="boom" aria-hidden="true" style="left:calc(50% + ${(s * .36).toFixed(1)}%);top:calc(50% - ${(s * .36).toFixed(1)}%)">🤯</span>` : ''}</div>`;
  }
  // доповнюємо останній тиждень, щоб підписи стали окремим рядком
  const used = firstWd(y, m) + daysIn(y, m);
  for (let i = used; i % 7; i++) h += '<div class="cell"></div>';
  // підпис днів тижня знизу, як у референсі
  if (labels) WD.forEach((w, i) => { h += `<div class="wd${i > 4 ? ' we' : ''}">${w}</div>`; });
  return h + '</div>';
}
function grow() { requestAnimationFrame(() => requestAnimationFrame(() => view.querySelectorAll('.dot').forEach(d => d.style.removeProperty('--s')))); }

function renderMonth() {
  const { y, m } = state;
  const st = monthStats(y, m);
  const idx = y * 12 + m;
  const canPrev = idx > FIRST.y * 12 + FIRST.m, canNext = idx < LAST.y * 12 + LAST.m;

  // порівняння з тим самим місяцем торік за однакову кількість днів
  const prevYear = byDate.has(key(y - 1, m, 1)) ? monthStats(y - 1, m, st.n) : null;
  const diff = prevYear ? (st.tot / prevYear.tot - 1) * 100 : null;
  const kmPerDayNote = st.complete ? '' : ` за ${st.n} ${plural(st.n, ['день', 'дні', 'днів'])}`;

  view.innerHTML = `
  <div class="month-layout">
    <div class="panel">
      <div class="mhead">
        <button class="navbtn" id="prev" ${canPrev ? '' : 'disabled'} aria-label="Попередній місяць">‹</button>
        <div><div class="mtitle">${MFA[m]} ${y}</div><div class="mtotal">${people(st.tot)}${kmPerDayNote}</div></div>
        <button class="navbtn" id="next" ${canNext ? '' : 'disabled'} aria-label="Наступний місяць">›</button>
      </div>
      ${calGrid(y, m, { best: st.mx.k })}
    </div>
    <div class="panel side">
      <h3>${MFA[m]} ${y} у цифрах</h3>
      <div class="kv"><span>Разом${st.complete ? '' : ' (місяць триває)'}</span><b>${sp(st.tot)}</b></div>
      <div class="kv"><span>У середньому за добу</span><b>${sp(st.avg)}</b></div>
      <div class="kv"><span>Найкращий день 🤯</span><b class="r">${sp(st.mx.v)} · ${st.mx.d} ${MGEN[m]}</b></div>
      <div class="kv"><span>Найслабший день</span><b>${sp(st.mn.v)} · ${st.mn.d} ${MGEN[m]}</b></div>
      ${prevYear ? `<div class="kv"><span>${MFA[m]} ${y - 1}${st.complete ? '' : `, перші ${st.n} ${plural(st.n, ['день', 'дні', 'днів'])}`}</span><b>${sp(prevYear.tot)}</b></div>
      <div class="kv"><span>Зміна за рік</span><b class="${diff >= 0 ? 'g' : ''}">${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(0)}%</b></div>` : ''}
      <div class="explain"><span class="lbl">Людською мовою</span>
        У ${MLOC[m]} ${y} рф щодоби втрачала в середньому <b>${people(st.avg)}</b> —
        приблизно ${sp(st.avg / 500)} ${plural(st.avg / 500, ['батальйон', 'батальйони', 'батальйонів'])} щодня.
        ${prevYear ? (diff >= 0
          ? `Це <b>на ${Math.abs(diff).toFixed(0)}% більше</b>, ніж за ті самі дні ${y - 1}-го.`
          : `Це на ${Math.abs(diff).toFixed(0)}% менше, ніж за ті самі дні ${y - 1}-го.`) : ''}
      </div>
      <a class="more" href="#roky-${pad(m + 1)}">${MFA[m]} в усі роки війни →</a>
    </div>
  </div>`;
  document.getElementById('prev').onclick = () => go({ m: m - 1 });
  document.getElementById('next').onclick = () => go({ m: m + 1 });
  grow();
}

function renderYear() {
  const { y } = state;
  const tot = [...byDate].filter(([k]) => k.startsWith(y + '-')).reduce((s, [, v]) => s + v, 0);
  const nDays = [...byDate.keys()].filter(k => k.startsWith(y + '-')).length;
  let h = `<div class="panel">
    <div class="yhead">
      <button class="navbtn" id="prev" ${y > FIRST.y ? '' : 'disabled'} aria-label="Попередній рік">‹</button>
      <div class="mtitle">${y}</div>
      <button class="navbtn" id="next" ${y < LAST.y ? '' : 'disabled'} aria-label="Наступний рік">›</button>
    </div>
    <div class="ytotal">${people(tot)}${nDays < 365 ? ` за ${nDays} ${plural(nDays, ['день', 'дні', 'днів'])}` : ''} · у середньому ${sp(tot / nDays)} на добу</div>
    <div class="year-grid">`;
  const stats = Array.from({ length: 12 }, (_, m) => monthStats(y, m));
  // найкращий місяць року — з найбільшою сумою втрат рф
  const bestM = stats.reduce((b, s, m) => (s && (b < 0 || s.tot > stats[b].tot) ? m : b), -1);
  stats.forEach((st, m) => {
    const best = m === bestM;
    h += `<button class="mini${best ? ' best' : ''}" data-m="${m}" ${st ? '' : 'disabled'} aria-label="${MFA[m]} ${y}${best ? ', найкращий місяць року' : ''}">
      <div class="mh"><span class="mn">${MFA[m]}${best ? ' <span class="fire" title="Найкращий місяць року">🔥</span>' : ''}</span><span class="mt">${st ? sp(st.tot) : '—'}</span></div>
      ${calGrid(y, m, { labels: false, interactive: false, best: st?.mx.k })}
    </button>`;
  });
  view.innerHTML = h + '</div><p class="note" style="text-align:center">Натисніть на місяць, щоб відкрити його докладно</p></div>';
  document.getElementById('prev').onclick = () => go({ y: y - 1 });
  document.getElementById('next').onclick = () => go({ y: y + 1 });
  view.querySelectorAll('.mini:not(:disabled)').forEach(b => b.onclick = () => go({ view: 'month', m: +b.dataset.m }));
  grow();
}

// ================= РОКИ ПОРУЧ =================
// Для кожної дати місяця — концентричні кола, по одному на кожен рік війни.
const RYEARS = [...new Set([...allByDate.keys()].map(k => +k.slice(0, 4)))];
const RPAL = { 2022: '#199e70', 2023: '#9085e9', 2024: '#d55181', 2025: '#3987e5', 2026: '#c98500' };
const EXTRA = ['#0ca30c', '#e66767', '#5598e7', '#eb6834'];
const ycol = y => window.PEREMOGIUM_YEARS?.color(y) || RPAL[y] || EXTRA[(y - 2027) % EXTRA.length]; // спільні кольори років (assets/years.js)
const RMAX = Math.max(...allByDate.values());
// Щільна купка кіл для дати: площа кола ∝ втратам, роки в однаковому порядку.
// (d3.packSiblings використовує поля x, y, r — тому рік зберігаємо як yr)
const packCache = new Map();
function cluster(m, d) {
  const k = m + '-' + d; if (packCache.has(k)) return packCache.get(k);
  const cs = RYEARS.map(yr => ({ yr, v: allByDate.get(key(yr, m, d)) }))
    .filter(c => c.v != null && c.v > 0).map(c => ({ ...c, r: Math.sqrt(c.v) }));
  if (cs.length) {
    d3.packSiblings(cs);
    const e = d3.packEnclose(cs);
    cs.forEach(c => { c.x -= e.x; c.y -= e.y; });
    cs.R = e.r;
  }
  packCache.set(k, cs); return cs;
}
// Спільний масштаб: найбільша купка за весь час заповнює ~96% клітинки.
let maxR = 0;
for (let m = 0; m < 12; m++) for (let d = 1; d <= 31; d++) maxR = Math.max(maxR, cluster(m, d).R || 0);
const KPACK = 48 / maxR; // відсотків клітинки на одиницю радіуса
const ryStats = (y, m) => { // втрати за місяць у році y
  const vals = []; for (let d = 1; d <= daysIn(y, m); d++) { const v = allByDate.get(key(y, m, d)); if (v != null) vals.push(v); }
  return vals.length ? { tot: vals.reduce((a, b) => a + b, 0), n: vals.length, avg: vals.reduce((a, b) => a + b, 0) / vals.length, full: vals.length === daysIn(y, m) } : null;
};

function renderYears() {
  const m = state.cm;
  const dmax = Math.max(...RYEARS.map(y => daysIn(y, m)));
  // кожен день — купка кіл («конфеті»), по одному на рік, щільно одне біля одного
  let g = '<div class="cal rgrid">';
  for (let d = 1; d <= dmax; d++) {
    const cl = cluster(m, d);
    if (!cl.length) { g += `<div class="cell future"><span class="rn">${d}</span></div>`; continue; }
    g += `<div class="cell rcell" tabindex="0" data-d="${d}" aria-label="${d} ${MGEN[m]}: ${cl.map(c => `${c.yr} — ${people(c.v)}`).join(', ')}">` +
      cl.map(c => `<span class="rdot" style="--c:${ycol(c.yr)};left:${(50 + c.x * KPACK).toFixed(2)}%;top:${(50 + c.y * KPACK).toFixed(2)}%;width:${(2 * c.r * KPACK).toFixed(2)}%;height:${(2 * c.r * KPACK).toFixed(2)}%"></span>`).join('') +
      `<span class="rn">${d}</span></div>`;
  }
  g += '</div>';

  const st = RYEARS.map(y => ({ y, s: ryStats(y, m) })).filter(x => x.s);
  const mxAvg = Math.max(...st.map(x => x.s.avg));
  const bars = st.map(({ y, s }) => `<div class="yb"><span style="color:${ycol(y)}">${y}</span>
      <div class="track"><div class="fill" style="width:${s.avg / mxAvg * 100}%;background:${ycol(y)}"></div></div>
      <b>${sp(s.avg)}</b></div>`).join('');
  const first = st[0], last = st.at(-1);
  const ratio = last.s.avg / first.s.avg;
  const best = st.reduce((a, b) => b.s.avg > a.s.avg ? b : a);
  view.innerHTML = `
  <div class="month-layout">
    <div class="panel">
      <div class="mhead">
        <button class="navbtn" id="prev" aria-label="Попередній місяць">‹</button>
        <div><div class="mtitle">${MFA[m]} · усі роки</div><div class="mtotal">${st.map(x => x.y).join(' · ')}</div></div>
        <button class="navbtn" id="next" aria-label="Наступний місяць">›</button>
      </div>
      ${g}
      <p class="note" style="text-align:center;margin-top:10px">Кожне коло — один рік (кольори — у легенді вгорі). Що більше коло, то більше втрат того дня. Наведіть або натисніть на день, щоб побачити цифри</p>
    </div>
    <div class="panel side">
      <h3>${MFA[m]}: втрати рф за добу</h3>
      <div class="ybars">${bars}</div>
      <div class="explain"><span class="lbl">Людською мовою</span>
        ${last.y === best.y ? `<b>${MFA[m]} ${last.y}-го — найважчий ${MFA[m].toLowerCase()} для рф за всю війну.</b> ` : ''}
        У ${MLOC[m]} ${last.y} рф втрачає в середньому <b>${people(last.s.avg)}</b> на добу${last.s.full ? '' : ` (поки ${last.s.n} ${plural(last.s.n, ['день', 'дні', 'днів'])})`} —
        ${ratio >= 1 ? `<b>у ${ratio.toFixed(1).replace('.', ',')} раза більше</b>` : `менше`}, ніж у ${MLOC[m]} ${first.y}.
      </div>
      <a class="more" href="war.html">Усі роки війни в цифрах →</a>
    </div>
  </div>`;
  document.getElementById('prev').onclick = () => go({ cm: (m + 11) % 12 });
  document.getElementById('next').onclick = () => go({ cm: (m + 1) % 12 });
}
function showRingTip(cell) {
  const m = state.cm, d = +cell.dataset.d;
  const rows = RYEARS.map(y => ({ y, v: allByDate.get(key(y, m, d)) })).filter(r => r.v != null);
  const mx = Math.max(...rows.map(r => r.v));
  tip.innerHTML = `<b>${d} ${MGEN[m]}</b>` + rows.map(r =>
    `<span class="trow"><i style="background:${ycol(r.y)}"></i>${r.y}: <span class="v">${sp(r.v)}</span>${r.v === mx && rows.length > 1 ? ' — найбільше' : ''}</span>`).join('');
  const r = cell.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let yy = r.top - th - 8; if (yy < 8) yy = r.bottom + 8;
  tip.style.left = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + 'px';
  tip.style.top = yy + 'px';
}

function render() {
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  hideTip();
  const lg = document.getElementById('legend');
  if (state.view === 'years') { lg.innerHTML = RYEARS.map(y => `<span><i class="c" style="width:12px;height:12px;background:${ycol(y)}"></i>${y}</span>`).join(''); renderYears(); }
  else { lg.innerHTML = LEGEND_HTML; state.view === 'year' ? renderYear() : renderMonth(); }
}

// Події підказки (делегування — працює і для миші, і для дотику)
view.addEventListener('mouseover', e => { const d = e.target.closest('.month-layout .dot'); if (d) showTip(d); });
view.addEventListener('mouseout', e => { if (e.target.closest('.dot')) hideTip(); });
view.addEventListener('focusin', e => { const d = e.target.closest('.month-layout .dot'); if (d) showTip(d); });
view.addEventListener('focusout', hideTip);
view.addEventListener('click', e => { const d = e.target.closest('.month-layout .dot'); if (d) showTip(d); });
view.addEventListener('mouseover', e => { const c = e.target.closest('.rcell'); if (c) showRingTip(c); });
view.addEventListener('mouseout', e => { if (e.target.closest('.rcell')) hideTip(); });
view.addEventListener('focusin', e => { const c = e.target.closest('.rcell'); if (c) showRingTip(c); });
view.addEventListener('click', e => { const c = e.target.closest('.rcell'); if (c) showRingTip(c); });

document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => go({ view: b.dataset.v })));
addEventListener('hashchange', () => { readHash(); render(); });

// Легенда розмірів
const legendVals = [1000, 2000, Math.round(MAX / 10) * 10];
const LEGEND_HTML = legendVals.map(v => {
  const s = Math.round(28 * Math.sqrt(v / MAX));
  return `<span><i class="c" style="width:${s}px;height:${s}px;background:${heat(v)}"></i>${sp(v)}</span>`;
}).join('') + `<span>менше<i class="ramp" style="background:linear-gradient(90deg, ${heat(MIN)}, ${heat((MIN + MAX) / 2)}, ${heat(MAX)})"></i>більше</span>`
  + `<span>🤯 найкращий день місяця</span><span>🔥 найкращий місяць року</span>`;

const dateUA = iso => { const d = new Date(iso); return `${d.getUTCDate()} ${MGEN[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
document.getElementById('note').innerHTML =
  `Джерело: щоденні зведення <a href="https://www.facebook.com/GeneralStaff.ua" target="_blank" rel="noopener">Генштабу ЗСУ</a> через архів <a href="https://russianwarship.rip/" target="_blank" rel="noopener">russianwarship.rip</a>. ` +
  `Ранкове зведення підбиває попередню добу, тому втрати показано в той день, коли вони сталися. Останній день у календарі — ${dateUA(lastDate.toISOString())}. ` +
  `Батальйон — умовно 500 осіб. Рекорд за весь період: ${people(MAX)} (${dateUA(recordDate)}), обведений білим. ` +
  `«Роки поруч» — з 25 лютого 2022; у перші тижні війни зведення виходили нерегулярно, тож дні того часу приблизні.`;
document.getElementById('footer').textContent = `Перемогіум · календар втрат · дані оновлено ${dateUA(D.generatedAt)}`;

readHash();
render();
})();
</script>
